    :root {
      color: #fff;
      background: #000;
      font-family: "Funnel Display", sans-serif;
      font-synthesis: none;
      text-rendering: geometricPrecision;
    }

    @view-transition {
      navigation: auto;
    }

    ::view-transition-group(lavori-panel) {
      animation-duration: 650ms;
      animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { box-sizing: border-box; }

    html, body {
      min-width: 320px;
      min-height: 100%;
      margin: 0;
      background: #000;
    }

    body { overflow-x: hidden; }
    body.is-loading { overflow: hidden; }
    a { color: inherit; }

    .page-loader {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
      color: #8cff00;
      background: #000;
      font-size: clamp(4rem, 8vw, 9rem);
      font-weight: 600;
      opacity: 1;
      visibility: visible;
      transition: opacity 450ms ease, visibility 450ms ease;
    }

    .page-loader.is-complete {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .landing-page {
      width: 100%;
      min-height: 100dvh;
      overflow: hidden;
      background: #000;
    }

    .landing-canvas {
      position: relative;
      width: 95%;
      height: 95.8dvh;
      min-height: 690px;
      margin: 2.1dvh auto;
    }

    .designer-meta {
      position: absolute;
      inset: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(3rem, 10.55vw, 12rem);
      height: 6.63%;
      font-size: clamp(0.85rem, 1.055vw, 1.2rem);
      font-weight: 400;
      line-height: normal;
      white-space: nowrap;
    }

    .designer-meta p { margin: 0; }

    .graphic-role {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .graphic-role sup {
      color: #6c0;
      font-size: 60%;
      font-weight: 400;
      line-height: 0;
    }

    .landing-content {
      position: absolute;
      inset: 16.09% 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 65.46%;
    }

    .primary-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: clamp(4.6rem, 7.04vw, 8rem);
    }

    .primary-nav a {
      position: relative;
      display: inline-flex;
      align-items: center;
      height: 100%;
      padding: 0 0.08em;
      overflow: hidden;
      color: #000;
      background: #fff;
      font-size: clamp(4.6rem, 7.04vw, 8rem);
      font-weight: 600;
      line-height: 1;
      text-decoration: none;
      text-transform: uppercase;
      white-space: nowrap;
      transform-origin: left center;
      opacity: 0;
      transform: scaleX(0);
    }

    .primary-nav a:last-child { transform-origin: right center; }

    .primary-nav a[href="lavori.html"] {
      view-transition-name: lavori-panel;
    }

    body.home-ready .primary-nav a {
      animation: box-reveal 300ms cubic-bezier(0.22, 1, 0.36, 1) 80ms both;
    }

    .primary-nav a::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      background: #8cff00;
      transform: scaleY(0);
      transform-origin: bottom center;
      transition: transform 320ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .primary-nav a:hover::before,
    .primary-nav a:focus-visible::before {
      transform: scaleY(1);
    }

    .primary-nav a:hover,
    .primary-nav a:focus-visible {
      outline: none;
    }

    .introduction { width: 100%; }

    .introduction h1 {
      display: flex;
      flex-direction: column;
      gap: 0 31px;
      row-gap: 0;
      column-gap: 31px;
      margin: 0;
      color: #fff;
      font-size: clamp(4.6rem, 7.04vw, 8rem);
      font-weight: 600;
      line-height: 1;
      text-transform: uppercase;
    }

    .intro-line {
      display: grid;
      grid-template-columns: 60.65fr 39.35fr;
      width: 100%;
    }

    .intro-line > span:last-child { text-align: right; }

    .name-line {
      position: relative;
      display: block;
      width: 100%;
      color: #8cff00;
      text-align: right;
    }

    .portrait-slot {
      position: absolute;
      top: 0;
      left: 0;
      width: clamp(4.6rem, 7.04vw, 8rem);
      height: clamp(4.6rem, 7.04vw, 8rem);
      overflow: hidden;
      background: #000;
    }

    .portrait-slot::after {
      content: "";
      position: absolute;
      inset: 0;
      background: #8cff00;
      mix-blend-mode: color;
      opacity: 1;
      pointer-events: none;
      transition: opacity 320ms ease;
    }

    .portrait-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(1) contrast(1.35);
      transform: scale(1.01);
      transition: filter 320ms ease, transform 320ms ease;
    }

    .portrait-slot:hover .portrait-image {
      filter: none;
      transform: scale(1);
    }

    .portrait-slot:hover::after { opacity: 0; }


    .animated-copy {
      display: inline-flex;
      overflow: hidden;
      vertical-align: bottom;
    }

    .primary-nav .animated-copy {
      position: relative;
      z-index: 1;
      color: #000;
      mix-blend-mode: multiply;
      --sequence-delay: 390ms;
    }

    .intro-line .animated-copy { --sequence-delay: 650ms; }
    .name-line > span:last-child .animated-copy { --sequence-delay: 880ms; }

    .letter {
      display: inline-block;
      opacity: 0;
      transform: translateY(110%);
    }

    body.home-ready .letter {
      animation: letter-reveal 260ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
      animation-delay: calc(var(--sequence-delay) + var(--letter-index) * 24ms);
    }

    body.motion-loaded .primary-nav .letter {
      opacity: 1;
      transform: none;
      animation: none;
    }

    .letter-space { width: 0.28em; }
    .letter-0 { --letter-index: 0; }
    .letter-1 { --letter-index: 1; }
    .letter-2 { --letter-index: 2; }
    .letter-3 { --letter-index: 3; }
    .letter-4 { --letter-index: 4; }
    .letter-5 { --letter-index: 5; }
    .letter-6 { --letter-index: 6; }
    .letter-7 { --letter-index: 7; }
    .letter-8 { --letter-index: 8; }
    .letter-9 { --letter-index: 9; }
    .letter-10 { --letter-index: 10; }
    .letter-11 { --letter-index: 11; }
    .letter-12 { --letter-index: 12; }
    .letter-13 { --letter-index: 13; }
    .letter-14 { --letter-index: 14; }
    .letter-15 { --letter-index: 15; }
    .letter-16 { --letter-index: 16; }
    .letter-17 { --letter-index: 17; }
    .letter-18 { --letter-index: 18; }
    .letter-19 { --letter-index: 19; }
    .letter-20 { --letter-index: 20; }

    @keyframes box-reveal {
      from { opacity: 0; transform: scaleX(0); }
      to { opacity: 1; transform: scaleX(1); }
    }

    @keyframes letter-reveal {
      to { opacity: 1; transform: translateY(0); }
    }

    footer {
      position: absolute;
      inset: auto 0 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 9%;
      font-size: clamp(0.65rem, 0.704vw, 0.8rem);
      font-weight: 400;
      line-height: 0.75;
      white-space: nowrap;
    }

    footer p { margin: 0; }

    @media (max-width: 900px) {
      .landing-canvas {
        display: flex;
        flex-direction: column;
        width: calc(100% - 32px);
        height: auto;
        min-height: 100dvh;
        margin: 0 auto;
        padding: 24px 0 18px;
      }

      .designer-meta,
      .landing-content,
      footer { position: static; }

      .designer-meta {
        justify-content: space-between;
        gap: 1rem;
        height: auto;
        font-size: 0.78rem;
      }

      .designer-meta > p:nth-child(2) { display: none; }

      .landing-content {
        flex: 1;
        height: auto;
        padding: 14vh 0 10vh;
      }

      .primary-nav { height: auto; }

      .primary-nav a {
        height: auto;
        font-size: clamp(2.5rem, 10vw, 5rem);
      }

      .introduction {
        margin-top: auto;
        padding-top: 24vh;
      }

      .introduction h1 {
        gap: 0.22em;

          </h1>
        </header>
      </section>

      <footer>
        <p>Copyright 2026 — ©Alessio Palermo</p>
      </footer>
    </div>
  </main>

  <script>
    document.querySelectorAll("[data-animate-text]").forEach((element) => {
      const text = element.textContent;
      const copy = document.createElement("span");
      copy.className = "animated-copy";
      copy.setAttribute("aria-hidden", "true");

      [...text].forEach((character, index) => {
        const letter = document.createElement("span");
        letter.className = `letter letter-${index}${character === " " ? " letter-space" : ""}`;
        letter.textContent = character === " " ? " " : character;
        copy.appendChild(letter);
      });

      element.textContent = "";
      element.setAttribute("aria-label", text);
      element.appendChild(copy);
    });

    const loader = document.querySelector(".page-loader");
    const loaderProgress = document.querySelector("#loader-progress");
    const loaderDuration = 4000;
    const loadingSteps = [
      { time: 0, value: 0 },
      { time: 0.08, value: 6 },
      { time: 0.18, value: 23 },
      { time: 0.29, value: 42 },
      { time: 0.38, value: 42 },
      { time: 0.53, value: 68 },
      { time: 0.62, value: 74 },
      { time: 0.7, value: 74 },
      { time: 0.82, value: 91 },
      { time: 0.9, value: 93 },
      { time: 0.95, value: 93 },
      { time: 1, value: 100 },
    ];
    const loaderStart = performance.now();
    const loaderInterval = 50;
    let loaderElapsed = 0;

    const getLoadingValue = (progress) => {
      const nextIndex = loadingSteps.findIndex((step) => step.time >= progress);
      const endIndex = nextIndex < 1 ? 1 : nextIndex;
      const start = loadingSteps[endIndex - 1];
      const end = loadingSteps[endIndex];
      const segment = (progress - start.time) / (end.time - start.time);
      const easedSegment = 1 - Math.pow(1 - Math.max(0, Math.min(1, segment)), 2);
      return Math.floor(start.value + (end.value - start.value) * easedSegment);
    };

    const completeLoading = () => {
      loaderProgress.textContent = "100";
      loader.classList.add("is-complete");

      window.setTimeout(() => {
        document.body.classList.remove("is-loading");
        document.body.classList.add("home-ready");

        window.setTimeout(() => {
          document.body.classList.add("motion-loaded");
        }, 1600);
      }, 450);
    };

    const updateLoading = () => {
      loaderElapsed += loaderInterval;
      const elapsed = Math.max(performance.now() - loaderStart, loaderElapsed);
      const progress = Math.min(elapsed / loaderDuration, 1);
      loaderProgress.textContent = String(getLoadingValue(progress));

      if (progress >= 1) {
        window.clearInterval(loaderTimer);
        completeLoading();
      }
    };

    const loaderTimer = window.setInterval(updateLoading, loaderInterval);
    updateLoading();
  </script>
</body>
</html>
